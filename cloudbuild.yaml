steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '--build-arg', 'VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}',
      '--build-arg', 'VITE_SUPABASE_ANON_KEY=${_VITE_SUPABASE_ANON_KEY}',
      '--build-arg', 'VITE_GEMINI_API_KEY=${_VITE_GEMINI_API_KEY}',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/snhu-app-repo/snhuapp:$COMMIT_SHA', 
      '.'
    ]

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/snhu-app-repo/snhuapp:$COMMIT_SHA']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'snhuapp',
      '--image', 'us-central1-docker.pkg.dev/$PROJECT_ID/snhu-app-repo/snhuapp:$COMMIT_SHA',
      '--region', 'us-central1',
      '--set-secrets', 'VITE_SUPABASE_URL=VITE_SUPABASE_URL:latest,VITE_SUPABASE_ANON_KEY=VITE_SUPABASE_ANON_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest'
    ]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/snhu-app-repo/snhuapp:$COMMIT_SHA'